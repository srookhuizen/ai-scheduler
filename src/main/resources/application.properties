spring.application.name=ai-scheduler
server.port=8080
# ----------------------------------------------------
# GEN AI CONFIGURATION
# ----------------------------------------------------
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=gemini-2.5-flash
# ----------------------------------------------------
# OLLAMA CONFIGURATION
# ----------------------------------------------------
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=qwen2.5:3b
# Lower temperature enforces strict, deterministic tool/function calling
spring.ai.ollama.chat.temperature=0.0
## Because the 3B model is so small, a 16K context window uses very little RAM.
spring.ai.ollama.chat.num-ctx=16384
# OPTIONAL: Control reasoning visibility for models like Qwen 3 or DeepSeek
# Set to 'true' if you want to stream or view the reasoning process before the tool call
spring.ai.ollama.chat.think=false
# Replaces .maxMessages(12) — defaults to 20 if left blank
#spring.ai.chat.memory.statements-window-size=12

# Should be the same as we're pulling in docker
spring.ai.ollama.embedding.model=mxbai-embed-large
spring.ai.vectorstore.pgvector.dimensions=1024

# ----------------------------------------------------
# Google Calendar CONFIGURATION
# ----------------------------------------------------
google.calendar.api.credentials=${GOOGLE_CALENDAR_CREDENTIALS}
google.calendar.api.calendar.id=${GOOGLE_CALENDAR_ID}
# ----------------------------------------------------
# POSTGRESQL VECTOR DATABASE CONNECTION
# ----------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/ai_scheduler_db
spring.datasource.username=scheduler_user
spring.datasource.password=my_secure_password_123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.chat.memory.repository.jdbc.initialize-schema=always

# Hibernate Database DDL Generation & Logging
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ----------------------------------------------------
# WHATSAPP API CONFIGURATION (WCE Emulator Environment)
# ----------------------------------------------------
whatsapp.api.base-url=http://localhost:3001/send-to-emulator
#whatsapp.api.sender.phone-number-id=1234567890
#whatsapp.api.receiver.phone-number=31612345678
whatsapp.api.phone-number-id=1234567890
whatsapp.api.access-token=mock-wce-token-xyz
whatsapp.api.verify-token=my-secret-wce-verify-token
# ----------------------------------------------------
