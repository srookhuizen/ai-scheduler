spring.application.name=ai-scheduler
server.port=8082

# Swap to Ollama by changing this to 'ollama', or to GenAI 'google', or to openAI 'openai'
spring.profiles.active=ollama
ai.scheduler.speech.enabled=false

# ----------------------------------------------------
# GEN AI CONFIGURATION
# ----------------------------------------------------
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=gemini-2.5-flash
spring.ai.google.genai.chat.temperature=0.0
spring.ai.google.genai.chat.think=false
# ----------------------------------------------------
# OpenAI CONFIGURATION
# ----------------------------------------------------
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.chat.model=llama-3.3-70b-versatile
spring.ai.openai.chat.temperature=0.0

# ----------------------------------------------------
# OLLAMA CONFIGURATION
# ----------------------------------------------------
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=qwen2.5:3b
# Lower temperature enforces strict, deterministic tool/function calling
spring.ai.ollama.chat.temperature=0.0
## 16 Gb RAM => 8K.
spring.ai.ollama.chat.options.num-ctx=8192
# OPTIONAL: Control reasoning visibility for models like Qwen 3 or DeepSeek
# Set to 'true' if you want to stream or view the reasoning process before the tool call
spring.ai.ollama.chat.think=false
# Replaces .maxMessages(12) — defaults to 20 if left blank
#spring.ai.chat.memory.statements-window-size=12

# Should be the same as we're pulling in docker
#spring.ai.ollama.embedding.model=mxbai-embed-large
#spring.ai.vectorstore.pgvector.dimensions=1024

# ----------------------------------------------------
# TTS Configurations (Using OpenAI Audio API wrapper)
# ----------------------------------------------------
spring.ai.openai.audio.speech.base-url=http://localhost:8880/v1
spring.ai.openai.audio.speech.api-key=not-needed-locally
spring.ai.openai.audio.speech.options.model=kokoro
## curl http://localhost:8880/v1/audio/voices ##
spring.ai.openai.audio.speech.options.voice=am_fenrir
spring.ai.openai.audio.speech.options.response-format=mp3
# ----------------------------------------------------
# Google Calendar CONFIGURATION
# ----------------------------------------------------
google.calendar.api.credentials=${GOOGLE_CALENDAR_CREDENTIALS}
google.calendar.api.calendar.id=${GOOGLE_CALENDAR_ID}
# ----------------------------------------------------
# POSTGRESQL VECTOR DATABASE CONNECTION
# ----------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/ai_scheduler_db
spring.datasource.username=scheduler_user
spring.datasource.password=my_secure_password_123
spring.datasource.driver-class-name=org.postgresql.Driver

#spring.ai.vectorstore.pgvector.initialize-schema=true
#spring.ai.chat.memory.repository.jdbc.initialize-schema=always

# Hibernate Database DDL Generation & Logging
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ----------------------------------------------------
# WHATSAPP API CONFIGURATION (WCE Emulator Environment)
# ----------------------------------------------------
whatsapp.api.base-url=http://localhost:3001/send-to-emulator
#whatsapp.api.sender.phone-number-id=1234567890
#whatsapp.api.receiver.phone-number=31612345678
whatsapp.api.phone-number-id=1234567890
whatsapp.api.access-token=mock-wce-token-xyz
whatsapp.api.verify-token=my-secret-wce-verify-token
# ----------------------------------------------------
# WHATSAPP API CONFIGURATION (Live Production Meta Cloud API)
# ----------------------------------------------------
# 1. Change local URL to Meta's global base API endpoint
#whatsapp.api.base-url=https://facebook.com
# 2. Replace with the actual Phone Number ID generated in your Meta Dashboard
#whatsapp.api.phone-number-id=YOUR_REAL_META_PHONE_NUMBER_ID
# 3. Replace with your permanent or temporary System User Access Token from Meta
#whatsapp.api.access-token=EAAG....YOUR_REAL_LIVE_METADATA_TOKEN....ZZ
# 4. Must match the exact string you typed into the Meta Configuration dashboard
#whatsapp.api.verify-token=my-super-secure-production-token-123

# ----------------------------------------------------
# AI CONTEXT & PROMPT LOGGING
# ----------------------------------------------------
# Enables core debug logging for Spring AI infrastructure
logging.level.org.springframework.ai=DEBUG

# Logs the exact request and response payloads from the ChatClient
logging.level.org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor=DEBUG

# Traces tool execution and function calling parameters
logging.level.org.springframework.ai.model.tool=DEBUG

# Optional: Traces database queries and parameters for chat memory/pgvector
logging.level.org.hibernate.orm.results.loading=TRACE

# ----------------------------------------------------
# ACTUATOR HEALTH CHECK CONFIGURATION
# ----------------------------------------------------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
