# Provide dummy variables for missing environment structures
#google.calendar.api.credentials=mock-credentials
#google.calendar.api.calendar.id=mock-id

# Global HTTP timeouts for all internal Ollama API connections
spring.ai.ollama.client.read-timeout=180s
spring.ai.ollama.client.connect-timeout=10s

# Tailored test options specifically for your evaluation engine
evaluation.ollama.model=bespoke-minicheck
evaluation.ollama.temperature=0.0

# In-Memory Database Configuration for Testing
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop