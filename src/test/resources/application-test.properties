# Schakel Google GenAI / Gemini specifiek uit voor de testsuite
spring.ai.google.genai.chat.enabled=false

# Dwing af dat de Ollama AutoConfiguration juist WEL start
spring.ai.ollama.chat.enabled=true

# Mock Google Calendar API-credentials (voorkomt JSON parsing fouten bij het opstarten)
google.calendar.api.credentials={"type": "service_account", "project_id": "mock-test"}

# WhatsApp API / WCE Mock properties
whatsapp.api.base-url=http://localhost:3001/send-to-emulator
whatsapp.api.access-token=mock-wce-token-xyz
whatsapp.api.verify-token=my-secret-wce-verify-token
whatsapp.api.sender.phone-number-id=1234567890
whatsapp.api.receiver.phone-number=31612345678
