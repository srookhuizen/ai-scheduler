services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-engine
    ports:
      - "11434:11434"
    volumes:
      - ollama-storage:/root/.ollama
    environment:
      - TZ=Europe/Amsterdam
    restart: unless-stopped
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        ollama serve &
        until ollama list >/dev/null 2>&1; do sleep 1; done
        ollama pull qwen2.5:3b
        ollama pull bespoke-minicheck
        echo '==> Pre-warming model weights in memory...'
        ollama run qwen2.5:3b ""
        ollama run bespoke-minicheck ""
        echo '==> AI engine initialization complete!'
        wait
    networks:
      - whatsapp-ai-network

  tts-engine:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    container_name: tts-engine
    ports:
      - "8880:8880"
    environment:
      - TZ=Europe/Amsterdam
    restart: unless-stopped
    networks:
      - whatsapp-ai-network

  postgres-db:
    image: postgres:16-alpine
    container_name: postgres-standard-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=ai_scheduler_db
      - POSTGRES_USER=scheduler_user
      - POSTGRES_PASSWORD=my_secure_password_123
      - TZ=Europe/Amsterdam
    volumes:
      - postgres-storage:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - whatsapp-ai-network

  wce-emulator:
    image: node:20-alpine
    container_name: whatsapp-cloud-emulator
    working_dir: /app
    ports:
      - "3001:3001"
      - "8080:8080"
    environment:
      - PORT=3001
      - TZ=Europe/Amsterdam
      - BOT_WEBHOOK_URL=http://hostpc:8081/webhook
    extra_hosts:
      - "hostpc:host-gateway"
    volumes:
      - wce-storage:/app
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        if [ ! -d "/app/node_modules" ]; then
          npx --yes degit DonnC/wce-emulator#main . --force
          npm install
          npm run postinstall || true
        fi
        npm run dev
    restart: unless-stopped
    networks:
      - whatsapp-ai-network

volumes:
  ollama-storage:
  postgres-storage:
  wce-storage:

networks:
  whatsapp-ai-network:
    driver: bridge
    name: whatsapp-ai-network