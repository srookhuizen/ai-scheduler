services:
  # THE AUTOMATED AI ENGINE
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-engine
    ports:
      - "11434:11434"
    volumes:
      - ollama-storage:/root/.ollama
    environment:
      - TZ=Europe/Amsterdam
    entrypoint: [ "/bin/sh", "-c" ]
    command: >
      "ollama serve &
       echo '==> Waiting for internal server socket to bind...' &&
       until ollama list >/dev/null 2>&1; do sleep 1; done &&
       echo '==> Connection active! Pre-loading agentic qwen2.5:3b weights...' &&
       ollama pull qwen2.5:3b &&
       echo '==> AI engine initialization complete!' &&
       wait"
    networks:
      - whatsapp-ai-network

  postgres-db:
    image: pgvector/pgvector:pg16
    container_name: postgres-vector-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=ai_scheduler_db
      - POSTGRES_USER=scheduler_user
      - POSTGRES_PASSWORD=my_secure_password_123
      - TZ=Europe/Amsterdam
    volumes:
      - postgres-storage:/var/lib/postgresql/data
    networks:
      - whatsapp-ai-network

volumes:
  ollama-storage:
  postgres-storage:

networks:
  whatsapp-ai-network:
    driver: bridge
