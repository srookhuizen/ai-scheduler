services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-engine
    ports:
      - "11434:11434"
    volumes:
      - ollama-storage:/root/.ollama
    environment:
      - TZ=Europe/Amsterdam
    entrypoint: [ "/bin/sh", "-c" ]
    command: >
      "ollama serve &
       until ollama list >/dev/null 2>&1; do sleep 1; done &&
       ollama pull gemma4:e2b &&
       ollama pull bespoke-minicheck &&
       echo '==> Pre-warming model weights in memory...' &&
       ollama run gemma4:e2b '' &&
       ollama run bespoke-minicheck '' &&
       echo '==> AI engine initialization complete!' &&
       wait"
    networks:
      - whatsapp-ai-network

  postgres-db:
    image: postgres:16-alpine
    container_name: postgres-standard-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=ai_scheduler_db
      - POSTGRES_USER=scheduler_user
      - POSTGRES_PASSWORD=my_secure_password_123
      - TZ=Europe/Amsterdam
    volumes:
      - postgres-storage:/var/lib/postgresql/data
    networks:
      - whatsapp-ai-network

  wce-emulator:
    image: node:20-alpine
    container_name: whatsapp-cloud-emulator
    working_dir: /app
    ports:
      - "3001:3001"
      - "8080:8080"
    environment:
      - PORT=3001
      - TZ=Europe/Amsterdam
      - BOT_WEBHOOK_URL=http://hostpc:8081/webhook
    extra_hosts:
      # This dynamically routes 'hostpc' to your computer's loopback, regardless of your IP
      - "hostpc:host-gateway"
    entrypoint: [ "/bin/sh", "-c" ]
    command: [ "npx --yes degit DonnC/wce-emulator#main . && npm install && (npm run postinstall || true) && npm run dev" ]
    restart: unless-stopped
    networks:
      - whatsapp-ai-network

volumes:
  ollama-storage:
  postgres-storage:

networks:
  whatsapp-ai-network:
    driver: bridge
